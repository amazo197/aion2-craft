name: refresh-data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/fetch_data.py
      - name: commit
        run: |
          git config user.name "aion2-craft bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          # meta.json's baked_at changes every run; only commit when real data moved
          if git diff --cached --quiet -- data ':!data/meta.json'; then
            echo "no data changes, skipping commit"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
